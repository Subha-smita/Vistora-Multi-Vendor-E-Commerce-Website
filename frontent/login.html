<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in | Vistora</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #E6F2DD;
      color: #1E2B22;
    }

    nav {
      background: #2F4A38;
      padding: 14px 24px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px 20px;
      align-items: center;
    }

    nav a {
      color: #fff;
      text-decoration: none;
    }

    nav .logo {
      font-weight: bold;
      font-size: 20px;
      margin-right: auto;
    }

    main {
      max-width: 900px;
      margin: 30px auto;
      padding: 0 16px;
    }

    h1 {
      color: #2F4A38;
    }

    .box {
      background: #fff;
      border: 1px solid #B1D3B9;
      border-radius: 6px;
      padding: 20px;
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin: 12px 0 4px;
    }

    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #88BDA4;
      border-radius: 4px;
      box-sizing: border-box;
      font: inherit;
    }

    button {
      background: #5C7057;
      color: #fff;
      border: 0;
      padding: 10px 18px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 15px;
      min-height: 42px;
    }

    button:hover {
      background: #2F4A38;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .msg {
      background: #D1EDD3;
      border: 1px solid #88BDA4;
      padding: 10px;
      border-radius: 4px;
      margin-top: 12px;
      overflow-wrap: anywhere;
    }

    a {
      color: #2F4A38;
    }
  </style>
</head>

<body>

  <nav>
    <a class="logo" href="index.html">Vistora</a>
    <a href="vendors.html">Vendors</a>
    <a href="coupons.html">Offers</a>
    <a href="login.html">Sign in</a>
    <a href="wishlist.html">Wishlist</a>
    <a href="cart.html">Cart (<span class="badge">0</span>)</a>
  </nav>

  <main>
    <div class="box" style="max-width:400px;margin:0 auto">
      <h1>Sign in</h1>

      <form id="login-form">
        <label for="email">Email</label>
        <input
          id="email"
          name="email"
          type="email"
          autocomplete="email"
          required
        >

        <label for="pw">Password</label>
        <input
          id="pw"
          name="pw"
          type="password"
          autocomplete="current-password"
          required
        >

        <p>
          <button type="submit">Sign in</button>
        </p>
      </form>

      <p>New here? <a href="create.html">Create an account</a></p>
      <p><a href="forgot-password.html">Forgot your password?</a></p>
    </div>
  </main>

  <script src="js/config.js" defer></script>
<script src="js/api.js" defer></script>
<script src="js/main.js" defer></script>
</body>
</html>
