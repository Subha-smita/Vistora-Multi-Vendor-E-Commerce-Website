<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add or edit product | Vistora</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#E6F2DD;color:#1E2B22}
nav{background:#2F4A38;padding:14px 24px;display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center}
nav a{color:#fff;text-decoration:none}nav .logo{font-weight:bold;font-size:20px;margin-right:auto}
nav a.on{border-bottom:2px solid #B08D57}
main{max-width:1000px;margin:30px auto;padding:0 16px}
h1{color:#2F4A38}a{color:#2F4A38}
.box{background:#fff;border:1px solid #B1D3B9;border-radius:6px;padding:20px;margin-bottom:16px}
label{display:block;margin:12px 0 4px}
input,select,textarea{width:100%;padding:10px;border:1px solid #88BDA4;border-radius:4px;box-sizing:border-box;font:inherit;background:#fff;min-height:44px}
textarea{min-height:90px}input[type=checkbox]{width:auto;min-height:0}
button,.btn{background:#5C7057;color:#fff;border:0;padding:10px 18px;border-radius:4px;cursor:pointer;text-decoration:none;display:inline-block;font-size:15px;min-height:44px}
button:hover,.btn:hover{background:#2F4A38}button:disabled{background:#B1D3B9;color:#3D4F42;cursor:default}
.ghost{background:#fff;color:#2F4A38;border:1px solid #5C7057}.ghost:hover{background:#D1EDD3;color:#2F4A38}
.narrow{max-width:420px;margin:0 auto}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin:16px 0}
.stat{background:#fff;border:1px solid #B1D3B9;border-top:3px solid #B08D57;border-radius:6px;padding:16px}
.stat span{font-size:14px;color:#3D4F42}.stat b{display:block;font-size:26px;color:#2F4A38}
.chart{display:flex;align-items:flex-end;gap:10px;height:200px}
.chart div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:13px;gap:6px}
.chart i{display:block;width:70%;background:#5C7057;border-radius:4px 4px 0 0}
.table-wrap{overflow-x:auto;background:#fff;border:1px solid #B1D3B9;border-radius:6px}
table{width:100%;border-collapse:collapse;min-width:520px}
th,td{padding:12px;border-bottom:1px solid #D1EDD3;text-align:left}th{background:#D1EDD3}
.chip{display:inline-block;padding:3px 10px;border-radius:14px;font-size:13px;background:#D1EDD3;color:#1E4A2C}
.chip.placed{background:#DCEBF5;color:#1D4560}.chip.packed,.chip.pending{background:#F6E9C8;color:#5E4512}
.chip.shipped{background:#D9DDF3;color:#2D3470}.chip.out{background:#F3D9D6;color:#6B2019}
.toolbar{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}.toolbar input{flex:1;min-width:200px}
.upload{border:2px dashed #89A482;border-radius:6px;padding:16px;background:#F5FAF1}
.msg{background:#D1EDD3;border:1px solid #88BDA4;padding:10px;border-radius:4px;margin-top:12px}.msg:empty{display:none}
@media(max-width:600px){.row2{grid-template-columns:1fr}nav{padding:12px 16px}}

/* Image picker */
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
label.pick{display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;height:44px;margin:0;padding:0 20px;background:#5C7057;color:#fff;border-radius:4px;cursor:pointer;font-size:15px}
label.pick:hover{background:#2F4A38}
.input-focus:focus-within label.pick{outline:3px solid #B08D57;outline-offset:2px}
.hint{font-size:14px;color:#3D4F42;margin:8px 0 0}
#preview{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.thumb{position:relative;width:90px;height:90px}
.thumb img{width:100%;height:100%;object-fit:cover;border-radius:4px;border:1px solid #B1D3B9;display:block}
.thumb .thumb-x{position:absolute;top:-8px;right:-8px;width:24px;height:24px;min-height:0;padding:0;border-radius:50%;background:#C80909;color:#fff;font-size:12px;line-height:24px;border:2px solid #fff}
.thumb .thumb-x:hover{background:#A30707}

/* Save and Cancel: same size */
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.btn-row button,.btn-row .btn{display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;height:44px;min-width:140px;margin:0;padding:0 20px;font:inherit;font-size:15px;line-height:1;border:1px solid #5C7057;border-radius:4px}
.btn-row button:disabled{border-color:#B1D3B9}
.btn-row .ghost{background:#fff;color:#2F4A38}
.btn-row .ghost:hover{background:#D1EDD3}
</style>
</head>
<body data-role="vendor">
<nav><a class="logo" href="dashboard.html">Vistora Vendor</a><a href="dashboard.html">Dashboard</a><a href="products.html">Products</a><a href="product-form.html" class="on">Add product</a><a href="orders.html">Orders</a><a href="../index.html">View store</a><a href="../login.html">Sign out</a></nav>
<main>
<h1 id="page-title">Add or edit product</h1>
<form id="product-form">
<div class="box"><h2>Details</h2>
  <label for="pname">Product name</label>
  <input id="pname" name="name" type="text" required>

  <label for="desc">Description</label>
  <textarea id="desc" name="description"></textarea>

  <div class="row2">
    <div><label for="price">Price (₹)</label><input id="price" name="price" type="number" required min="1"></div>
    <div><label for="stock">Stock</label><input id="stock" name="stock" type="number" required min="0" value="1"></div>
  </div>

  <label for="cat">Category</label>
  <select id="cat" name="category"><option>Fashion</option><option>Electronics</option><option>Home</option><option>Beauty</option><option>Sports</option><option>Books</option></select>
</div>

<div class="box" id="image-upload"><h2>Images</h2>
  <div class="input-focus">
    <input id="images" type="file" class="sr-only" accept="image/jpeg,image/png,image/webp" multiple>
    <label class="pick" for="images">Add images</label>
  </div>
  <p class="hint" id="image-count">No images selected</p>
  <p class="hint">Up to 10 images,[5 MB, JPG, PNG or WEBP]</p>
  <div id="preview"></div>
</div>

<div class="box" id="image-note" hidden><h2>Images</h2>
  <p class="hint">The current images are kept. To change them, delete this product and add it again.</p>
</div>

<div class="btn-row">
  <button type="submit" id="save-btn">Save product</button>
  <a class="btn ghost" href="products.html">Cancel</a>
</div>
</form>
</main>
<script src="../js/config.js" defer></script>
<script src="../js/api.js" defer></script>
<script src="../js/main.js" defer></script>
<script src="../js/vendor-product-form.js" defer></script>
</body>
</html>
