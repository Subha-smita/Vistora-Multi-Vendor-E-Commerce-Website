<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coupons | Vistora</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#E6F2DD;color:#1E2B22}
nav{background:#2F4A38;padding:14px 24px;display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center}
nav a{color:#fff;text-decoration:none}nav .logo{font-weight:bold;font-size:20px;margin-right:auto}
nav a.on{border-bottom:2px solid #B08D57}
main{max-width:1000px;margin:30px auto;padding:0 16px}
h1{color:#2F4A38}
.box{background:#fff;border:1px solid #B1D3B9;border-radius:6px;padding:20px;margin-bottom:16px}
label{display:block;margin:12px 0 4px}
input,select{width:100%;padding:10px;border:1px solid #88BDA4;border-radius:4px;box-sizing:border-box;font:inherit;background:#fff;min-height:44px}
button{background:#5C7057;color:#fff;border:0;padding:10px 18px;border-radius:4px;cursor:pointer;font-size:15px;min-height:44px}
button:hover{background:#2F4A38}button:disabled{background:#B1D3B9;color:#3D4F42;cursor:default}
.ghost{background:#fff;color:#2F4A38;border:1px solid #5C7057}.ghost:hover{background:#D1EDD3;color:#2F4A38}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.table-wrap{overflow-x:auto;background:#fff;border:1px solid #B1D3B9;border-radius:6px}
table{width:100%;border-collapse:collapse;min-width:520px}
th,td{padding:12px;border-bottom:1px solid #D1EDD3;text-align:left}th{background:#D1EDD3}
.chip{display:inline-block;padding:3px 10px;border-radius:14px;font-size:13px;background:#D1EDD3;color:#1E4A2C}
.chip.out{background:#F3D9D6;color:#6B2019}
@media(max-width:600px){.row2{grid-template-columns:1fr}nav{padding:12px 16px}}
</style>
</head>
<body data-role="admin">
<nav><a class="logo" href="dashboard.html">Vistora Admin</a><a href="dashboard.html">Analytics</a><a href="products.html">Product approvals</a><a href="vendors.html">Vendor approvals</a><a href="coupons.html" class="on">Coupons</a><a href="orders.html">All orders</a><a href="../index.html">View store</a><a href="../login.html">Sign out</a></nav>
<main>
<h1>Coupons</h1>
<form id="coupon-create" class="box"><h2>Create coupon</h2>
<div class="row2">
<div><label for="c-code">Code</label><input id="c-code" type="text" required placeholder="SAVE15"></div>
<div><label for="c-type">Type</label><select id="c-type"><option value="percent">Percentage (%)</option><option value="flat">Flat amount (₹)</option><option value="shipping">Free shipping</option></select></div>
<div><label for="c-value">Value</label><input id="c-value" type="number" required min="1"></div>
<div><label for="c-min">Minimum order (₹)</label><input id="c-min" type="number" required min="0" value="0"></div>
<div><label for="c-limit">Usage limit</label><input id="c-limit" type="number" required min="1"></div>
<div><label for="c-expiry">Expiry date</label><input id="c-expiry" type="date" required></div>
</div>
<p><button type="submit" id="c-save">Create coupon</button></p></form>

<h2>All coupons</h2>
<div class="table-wrap"><table id="coupon-list">
<thead><tr><th>Code</th><th>Discount</th><th>Min order</th><th>Used</th><th>Expires</th><th>Status</th><th>Action</th></tr></thead>
<tbody></tbody></table></div>
</main>
<script src="../js/config.js" defer></script>
<script src="../js/api.js" defer></script>
<script src="../js/main.js" defer></script>
<script src="../js/admin-coupons.js" defer></script>
</body>
</html>
